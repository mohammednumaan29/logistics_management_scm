
spring:
  application:
    name: disruptioniq-backend

  neo4j:
    uri: ${NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:}

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

  jwt:
    secret: ${JWT_SECRET:}

  webhook:
    carrier-secret: ${CARRIER_WEBHOOK_SECRET:}

  security:
    bootstrap-admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: never

info:
  app:
    name: DisruptionIQ Backend
    description: Supply Chain Disruption Detection and Recovery Platform
    version: 1.0.0

ai:
  service:
    url: ${AI_SERVICE_URL:http://127.0.0.1:8000}